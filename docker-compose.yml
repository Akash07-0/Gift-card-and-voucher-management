services:
  mysql:
    image: mysql:8.4
    container_name: voucher-mysql
    environment:
      MYSQL_DATABASE: voucher_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: secure-voucher-app
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/voucher_db?useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-to-a-long-random-production-secret-key-123456789
    ports:
      - "8080:8080"

volumes:
  mysql_data:
