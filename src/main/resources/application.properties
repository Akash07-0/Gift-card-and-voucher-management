
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voucher_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
server.port=${PORT:8080}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true