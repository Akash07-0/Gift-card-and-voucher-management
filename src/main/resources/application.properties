spring.application.name=secure-voucher-system
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voucher_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Change this in production. Keep secrets outside source control.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

springdoc.swagger-ui.path=/swagger-ui.html
